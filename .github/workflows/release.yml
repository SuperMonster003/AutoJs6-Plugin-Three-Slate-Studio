name: Release

# Roadmap P0.3: a v{VERSION_NAME} tag builds the single signed release APK
# (autojs6-plugin-three-slate-studio-v{VERSION_NAME}-{CRC32}.apk), its SHA256SUMS and the official index manifest draft,
# and keeps them as a workflow artifact. Publishing the GitHub Release and registering the manifest in the index stay
# manual release steps (roadmap P5.4). The signing secrets use the names of the other official plugins.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK and index manifest draft
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify the tag and the repository contract
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          python .python/check_repository.py
          python .python/generate_markdown.py --check
          python .python/generate_third_party_notices.py --check

      - name: Materialize release signing configuration
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEY_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/autojs6-plugin-three-slate-studio-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_SIGNING_KEY_PASSWORD"
          } > sign.properties

      - name: Build, verify and collect the release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:appendDigestToReleasedFiles -Pautojs.gradle.build.number.auto.increment.enabled=false -Pautojs.gradle.build.time.update.enabled=false --no-daemon --console=plain --stacktrace
          mapfile -t apks < <(find releases -maxdepth 1 -type f -name 'autojs6-plugin-three-slate-studio-v*.apk' -print | sort)
          test "${#apks[@]}" -eq 1
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "${apks[0]}"
          (cd releases && sha256sum -- "$(basename "${apks[0]}")" > SHA256SUMS)
          python .python/release_manifest.py --apk "${apks[0]}" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --build-tools "$build_tools"

      - name: Upload the release artifact
        uses: actions/upload-artifact@v7
        with:
          name: autojs6-plugin-three-slate-studio-${{ github.ref_name }}
          path: |
            releases/*.apk
            releases/SHA256SUMS
            releases/manifest/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove signing material
        if: always()
        run: |
          rm -f sign.properties "$RUNNER_TEMP/autojs6-plugin-three-slate-studio-release.jks"
