[versions]

# Compose 1.12 line (compileSdk 37, AGP 9.1+), the line of 3-Maple Image and 3-Block Compose (roadmap D25). The BOM
# manages every Compose artifact and activity-compose, so those carry no version of their own.
compose-bom = "2026.09.00"
core-ktx = "1.18.0"
foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
# Roadmap D25: the Media3 line of 3-Terra Player. Transformer, Effect and Muxer do the processing (roadmap D29),
# ExoPlayer and UI the previews of the studio screens (roadmap P4).
media3 = "1.10.1"
navigation = "2.10.2"
# The test library line of 3-Macaw Speech: Espresso 3.5.0 calls InputManager.getInstance, gone on API 36.
test-espresso-core = "3.7.0"
test-junit-version = "1.3.0"
test-rules = "1.7.0"
test-runner = "1.7.0"

[libraries]

compose-activity = { module = "androidx.activity:activity-compose" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
junit = { module = "junit:junit", version.ref = "junit" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-muxer = { module = "androidx.media3:media3-muxer", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "test-espresso-core" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit-version" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }

[plugins]

foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
